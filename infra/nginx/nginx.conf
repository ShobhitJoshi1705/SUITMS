events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Docker's embedded DNS updates service IPs when Compose recreates a container.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Performance Tuning
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # Rate Limiting Zones (Prevents DDoS and Ingestion Storms)
    limit_req_zone $binary_remote_addr zone=api_general_limit:10m rate=120r/s;
    limit_req_zone $binary_remote_addr zone=edge_ingest_limit:10m rate=200r/s;

    # Upstream Frontend Service
    upstream suitms_frontend {
        server frontend:3000;
        keepalive 16;
    }

    server {
        listen 80;
        server_name localhost suitms.local;
        set $api_backend api-1:8000;

        # Standard Proxy Headers
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Resilient Upstream Failover: If an API node crashes or times out, immediately route to next replica
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 10s;

        # Health Probes for Ingress
        location /health/lb {
            access_log off;
            return 200 '{"status":"LB_HEALTHY"}';
            add_header Content-Type application/json;
        }

        # Stateless REST API Endpoints
        location /api/ {
            limit_req zone=api_general_limit burst=50 nodelay;
            proxy_pass http://$api_backend$request_uri;
            proxy_read_timeout 15s;
            proxy_connect_timeout 5s;
        }

        # Edge High-Throughput Ingestion Endpoint
        location /api/v1/violations/ingest {
            limit_req zone=edge_ingest_limit burst=100 nodelay;
            proxy_pass http://$api_backend$request_uri;
            proxy_read_timeout 10s;
            proxy_connect_timeout 3s;
        }

        # Active Readiness & Liveness Passthrough
        location /health/ {
            proxy_pass http://$api_backend$request_uri;
            access_log off;
        }

        # Prometheus Metrics Endpoint
        location /metrics {
            proxy_pass http://$api_backend$request_uri;
            allow 127.0.0.1;
            allow 172.16.0.0/12;
            allow 10.0.0.0/8;
            allow 192.168.0.0/16;
        }

        # Media Artifacts / Object Storage Serving
        location /artifacts/ {
            proxy_pass http://$api_backend$request_uri;
            expires 7d;
            add_header Cache-Control "public, no-transform";
        }

        # Real-time WebSocket Stream for Dashboard Push
        location /ws/ {
            proxy_pass http://$api_backend$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Citizen Web Portal & Authority Dashboard (React Frontend)
        location / {
            proxy_pass http://suitms_frontend;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
